schema_version = "1.4"
artifacts = [
    "/root/biclique_cover_submission/solver.py",
]

[task]
name = "turing/minimum-biclique-cover"
description = "Cover the 1-entries of a 0/1 matrix with the minimum number of all-ones rectangles and prove optimality with a matching packing witness, including large instances whose optimum is certified only by the hidden rectangle structure."
version = "1.0"
keywords = ["biclique-cover", "boolean-rank", "set-cover", "packing", "combinatorial-optimization", "hidden-structure"]

[metadata]
domain = "mathematical-sciences"
category = "operations-research"
subcategory = "combinatorial optimization and Boolean matrix decomposition"
reward_type = "binary"
source = "Written by PhD annotators"
public_overlap = "No public benchmark overlap: instances are deterministic synthetic matrices generated for this task."
expert_time_estimate_hours = 48.0

[verifier]
timeout_sec = 21600.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 18000
network_mode = "public"

[environment]
build_timeout_sec = 900.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
